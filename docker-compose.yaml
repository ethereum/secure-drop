services:
  web:
    build: .
    command: gunicorn server:app -w 4 -b 0.0.0.0:4200 --timeout 120 --access-logfile - --error-logfile -
    ports:
      - "4200:4200"
    volumes:
      - .:/app
    environment:
      FLASK_APP: server.py
      FLASK_DEBUG: ${DEBUG}
      DEBUG: ${DEBUG}
      VERIFIER_URL: http://verifier:3000
    depends_on:
      - verifier
  verifier:
    build:
      context: .
      dockerfile: verifier/Dockerfile
    environment:
      ZKPASSPORT_DOMAIN: ${ZKPASSPORT_DOMAIN}
      ZKPASSPORT_SCOPE: ${ZKPASSPORT_SCOPE}
      ZKPASSPORT_FACEMATCH: ${ZKPASSPORT_FACEMATCH:-strict}
    volumes:
      - verifier-cache:/tmp/zkp

volumes:
  verifier-cache:
